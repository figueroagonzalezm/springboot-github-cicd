name: CI

# Events: which activity triggers this workflow.
on:
  push:
    branches: [main]        # runs on every commit pushed to main
  pull_request:
    branches: [main]        # runs on every PR targeting main (validates before merge)
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

# Least-privilege default: this workflow only needs to read the repo contents.
permissions:
  contents: read

jobs:
  build-and-test:           # job id — jobs run in parallel by default, each on its own runner
    runs-on: ubuntu-latest  # GitHub-hosted runner (a fresh VM per run)

    steps:
      # Steps run sequentially, in the same runner filesystem, sharing state between them.
      - name: Checkout repository
        uses: actions/checkout@v4   # actions/* are reusable "actions"; @v4 pins the version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caching: reuses ~/.gradle between runs so dependencies aren't re-downloaded every time.
      # The key includes a hash of the Gradle files, so a new cache is created only when
      # dependencies/config actually change; restore-keys falls back to the closest older cache.
      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew   # runner checkout doesn't preserve the executable bit

      - name: Build
        run: ./gradlew build -x test   # compile + package, tests skipped here (run as their own step below)

      - name: Test
        run: ./gradlew test

      # Artifacts: files uploaded from the runner that you can download from the run summary.
      # if: always() makes sure the report still gets published even if the Test step failed.
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 14
