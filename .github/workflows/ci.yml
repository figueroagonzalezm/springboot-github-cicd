name: CI

# Events: which activity triggers this workflow.
on:
  push:
    branches: [main]        # runs on every commit pushed to main
  pull_request:
    branches: [main]        # runs on every PR targeting main (validates before merge)
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

jobs:
  build-and-test:
    # `uses:` a local path (./.github/workflows/...) calls a reusable workflow in this
    # same repo instead of running steps inline. `with:` passes its declared inputs —
    # this is the caller side of the workflow_call pattern in build-and-test.yml.
    uses: ./.github/workflows/build-and-test.yml
    with:
      java-version: '17'
      gradle-task: 'build'
