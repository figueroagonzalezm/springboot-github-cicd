apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  labels:
    app: springboot-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot-app
          # Rewritten per-environment by the `images:` transformer in each
          # overlay (see overlays/production/kustomization.yaml); the CD job
          # sets the concrete tag with `kustomize edit set image` at deploy time.
          image: springboot-app
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: springboot-app-config
          readinessProbe:
            httpGet:
              path: /employees
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /employees
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
